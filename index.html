<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RFID Attendance</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#06080f;--s1:#0d1117;--s2:#111820;--s3:#162030;
  --border:#1c2c3e;--accent:#00d4ff;--green:#00e5a0;
  --red:#ff4d6d;--amber:#ffb830;--text:#dde6f0;--muted:#4a6075;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--display:'Bebas Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,255,.012) 2px,rgba(0,212,255,.012) 4px)}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px;position:relative;z-index:1}

/* ── Header ── */
header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:16px}
.logo{display:flex;align-items:center;gap:14px}
.logo-icon{width:44px;height:44px;border:2px solid var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;
  box-shadow:0 0 18px rgba(0,212,255,.25)}
.logo-text h1{font-family:var(--display);font-size:2rem;letter-spacing:.06em;
  background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-text p{font-size:.75rem;color:var(--muted);font-family:var(--mono);margin-top:1px}
.header-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ── Config ── */
.config{background:var(--s1);border:1px solid var(--border);border-radius:10px;
  padding:14px 18px;margin-bottom:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.config label{font-size:.72rem;font-family:var(--mono);color:var(--muted);white-space:nowrap}
.config input{flex:1;min-width:260px;background:var(--s2);border:1px solid var(--border);
  border-radius:7px;color:var(--text);font-family:var(--mono);font-size:.78rem;
  padding:9px 13px;outline:none;transition:border-color .2s}
.config input:focus{border-color:var(--accent)}
.config input::placeholder{color:var(--muted)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:7px;
  font-family:var(--font);font-size:.82rem;font-weight:600;cursor:pointer;border:none;
  transition:all .18s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#06080f}
.btn-primary:hover{background:#33ddff;transform:translateY(-1px);box-shadow:0 4px 18px rgba(0,212,255,.3)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-amber{background:var(--amber);color:#06080f}
.btn-amber:hover{background:#ffc93c;transform:translateY(-1px);box-shadow:0 4px 18px rgba(255,184,48,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

/* ── Progress ── */
.prog-wrap{height:2px;background:var(--border);border-radius:2px;margin-bottom:22px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));width:100%;transition:width linear}

/* ── Stats ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:18px 16px;
  position:relative;overflow:hidden;transition:transform .2s}
.stat:hover{transform:translateY(-2px)}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat.c-blue::before{background:var(--accent)}.stat.c-green::before{background:var(--green)}
.stat.c-red::before{background:var(--red)}.stat.c-amber::before{background:var(--amber)}
.stat-label{font-size:.68rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stat-val{font-family:var(--display);font-size:2.2rem;letter-spacing:.04em;margin-top:6px;line-height:1}
.stat.c-blue .stat-val{color:var(--accent)}.stat.c-green .stat-val{color:var(--green)}
.stat.c-red .stat-val{color:var(--red)}.stat.c-amber .stat-val{color:var(--amber)}

/* ── Filters ── */
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1;min-width:180px;background:var(--s1);border:1px solid var(--border);
  border-radius:7px;color:var(--text);font-family:var(--mono);font-size:.82rem;
  padding:9px 13px;outline:none;transition:border-color .2s}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:var(--muted)}
select.fsel{background:var(--s1);border:1px solid var(--border);border-radius:7px;
  color:var(--text);font-family:var(--mono);font-size:.78rem;padding:9px 13px;outline:none;cursor:pointer}
select.fsel:focus{border-color:var(--accent)}

/* ── Table card ── */
.card{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.card-title{font-weight:600;font-size:.92rem}
.rec-count{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;min-width:520px}
thead th{text-align:left;padding:10px 16px;font-size:.67rem;font-family:var(--mono);
  text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
  background:var(--s2);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);transition:background .12s;animation:rowIn .25s ease both}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--s2)}
td{padding:12px 16px;font-size:.85rem;vertical-align:middle}
.td-ts{font-family:var(--mono);font-size:.73rem;color:var(--muted);white-space:nowrap}
.td-uid{font-family:var(--mono);font-size:.73rem;color:var(--accent)}
.td-name{font-weight:600}
.grade-pill{display:inline-block;font-family:var(--mono);font-size:.68rem;
  padding:3px 9px;border-radius:20px;background:rgba(0,212,255,.1);color:var(--accent);border:1px solid rgba(0,212,255,.2)}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:20px}
.badge-ok{background:rgba(0,229,160,.1);color:var(--green);border:1px solid rgba(0,229,160,.2)}
.badge-deny{background:rgba(255,77,109,.1);color:var(--red);border:1px solid rgba(255,77,109,.2)}
.badge-dot{width:5px;height:5px;border-radius:50%}
.badge-ok .badge-dot{background:var(--green)}.badge-deny .badge-dot{background:var(--red)}
@keyframes rowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .ico{font-size:2.2rem;margin-bottom:10px;opacity:.5}
.empty p{font-size:.85rem}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:rotate .65s linear infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-family:var(--mono);color:var(--green)}
.live::before{content:'';width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse 1.4s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
#toast{position:fixed;bottom:22px;right:22px;background:var(--s1);border:1px solid var(--border);
  border-radius:8px;padding:11px 16px;font-family:var(--mono);font-size:.8rem;
  opacity:0;transform:translateY(10px);transition:all .25s;z-index:9999;max-width:280px}
#toast.show{opacity:1;transform:translateY(0)}
#toast.ok{border-left:3px solid var(--green);color:var(--green)}
#toast.err{border-left:3px solid var(--red);color:var(--red)}
#toast.inf{border-left:3px solid var(--accent);color:var(--accent)}

/* ── Table scroll ── */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-scroll-wrap{position:relative;border-radius:0 0 12px 12px;overflow:hidden}
.table-scroll-wrap::after{content:'';position:absolute;top:0;right:0;bottom:0;width:32px;
  background:linear-gradient(to right,transparent,rgba(6,8,15,.7));pointer-events:none;opacity:0;transition:opacity .3s}
.table-scroll-wrap.can-scroll::after{opacity:1}
.scroll-hint{display:none;text-align:center;font-size:.68rem;font-family:var(--mono);
  color:var(--muted);padding:6px 0 4px;letter-spacing:.08em}
.scroll-btns{display:none;justify-content:space-between;align-items:center;padding:0 10px 10px;gap:8px}
.scroll-btn{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:1rem;padding:8px 0;cursor:pointer;
  transition:background .15s,border-color .15s;text-align:center;
  user-select:none;-webkit-tap-highlight-color:transparent}
.scroll-btn:active{background:var(--s3);border-color:var(--accent);color:var(--accent)}

/* ══════════════════════════════════════
   REPORT MODAL
══════════════════════════════════════ */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(6,8,15,.85);
  z-index:1000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex}
.modal{background:var(--s1);border:1px solid var(--border);border-radius:14px;
  width:100%;max-width:520px;max-height:90vh;overflow-y:auto;position:relative}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-hdr h2{font-size:1rem;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;
  line-height:1;padding:4px 8px;border-radius:6px;transition:color .15s}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.form-group{flex:1;min-width:140px}
.form-group label{display:block;font-size:.72rem;font-family:var(--mono);
  color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.form-group select,
.form-group input[type=date]{width:100%;background:var(--s2);border:1px solid var(--border);
  border-radius:7px;color:var(--text);font-family:var(--mono);font-size:.82rem;
  padding:9px 12px;outline:none;transition:border-color .2s;cursor:pointer}
.form-group select:focus,
.form-group input[type=date]:focus{border-color:var(--accent)}
.form-group input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.6)}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ══════════════════════════════════════
   PRINT STYLES
══════════════════════════════════════ */
@media print{
  body{background:#fff!important;color:#000!important}
  body::after{display:none}
  .wrap,.modal-bg,.modal,.header-right,.config,.prog-wrap,.stats,
  .filters,.scroll-hint,.scroll-btns,#toast,.no-print{display:none!important}
  #printArea{display:block!important}
  #printArea *{color:#000!important;background:#fff!important;border-color:#ccc!important}
  .print-header{text-align:center;padding:0 0 16px;border-bottom:2px solid #222;margin-bottom:16px}
  .print-header h1{font-size:1.4rem;font-weight:800;letter-spacing:.04em}
  .print-header p{font-size:.8rem;color:#555!important;margin-top:4px}
  .print-meta{display:flex;gap:24px;flex-wrap:wrap;font-size:.8rem;
    background:#f5f5f5!important;border:1px solid #ddd!important;
    border-radius:6px;padding:10px 14px;margin-bottom:14px}
  .print-meta span{color:#333!important}
  .print-meta strong{color:#000!important}
  .print-summary{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
  .print-sum-card{border:1px solid #ccc!important;border-radius:6px;
    padding:8px 14px;text-align:center;min-width:80px}
  .print-sum-card .ps-val{font-size:1.4rem;font-weight:800}
  .print-sum-card .ps-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#666!important}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  thead th{background:#222!important;color:#fff!important;padding:8px 10px;
    text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
  tbody td{padding:7px 10px;border-bottom:1px solid #eee!important}
  tbody tr:nth-child(even) td{background:#f9f9f9!important}
  .p-ok{color:#1a5c1a!important;font-weight:700}
  .p-deny{color:#8b0000!important;font-weight:700}
}

/* Print area hidden on screen */
#printArea{display:none}

@media(max-width:700px){
  .wrap{padding:16px 12px 60px}
  .stat-val{font-size:1.7rem}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .filters{gap:8px}
  .search{font-size:.78rem}
  header{margin-bottom:20px}
  .logo-text h1{font-size:1.6rem}
  .btn{padding:8px 13px;font-size:.78rem}
  .scroll-hint{display:block}
  .scroll-btns{display:flex}
  .card-head{padding:12px 14px}
  thead th{padding:8px 12px;font-size:.62rem}
  td{padding:10px 12px;font-size:.8rem}
  .td-ts{font-size:.68rem}.td-uid{font-size:.68rem}
}
@media(max-width:400px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .header-right{gap:6px}
  .btn{padding:7px 10px;font-size:.74rem}
}
</style>
</head>
<body>

<!-- ═══════════════════ MAIN DASHBOARD ═══════════════════ -->
<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-icon">📡</div>
      <div class="logo-text">
        <h1>RFID ATTENDANCE</h1>
        <p id="lastUpdated" style="font-family:var(--mono);font-size:.72rem;color:var(--muted)">Not loaded</p>
      </div>
    </div>
    <div class="header-right">
      <span class="live" id="liveDot" style="display:none">LIVE</span>
      <button class="btn btn-amber" onclick="openReport()">🖨 Report</button>
      <button class="btn btn-ghost" id="autoBtn" onclick="toggleAuto()">⏱ Auto: OFF</button>
      <button class="btn btn-ghost" onclick="exportCSV()">⬇ CSV</button>
      <button class="btn btn-primary" id="loadBtn" onclick="loadData()">
        <span id="loadIcon">↻</span> Load
      </button>
    </div>
  </header>

  <div class="config">
    <label>SCRIPT URL</label>
    <input id="urlInput" type="text" placeholder="https://script.google.com/macros/s/YOUR_ID/exec"/>
    <button class="btn btn-primary" onclick="loadData()">Connect</button>
  </div>

  <div class="prog-wrap"><div class="prog-fill" id="progFill"></div></div>

  <div class="stats">
    <div class="stat c-blue"><div class="stat-label">Total</div><div class="stat-val" id="sTotal">—</div></div>
    <div class="stat c-green"><div class="stat-label">Authorised</div><div class="stat-val" id="sAuth">—</div></div>
    <div class="stat c-red"><div class="stat-label">Denied</div><div class="stat-val" id="sDeny">—</div></div>
    <div class="stat c-amber"><div class="stat-label">Unique</div><div class="stat-val" id="sUniq">—</div></div>
  </div>

  <div class="filters">
    <input class="search" id="searchBox" placeholder="🔍  Search name, UID, grade…" oninput="render()"/>
    <select class="fsel" id="fStatus" onchange="render()">
      <option value="">All Status</option>
      <option>Authorised</option>
      <option>Denied</option>
    </select>
    <select class="fsel" id="fGrade" onchange="render()">
      <option value="">All Grades</option>
    </select>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="card-title">Attendance Log</span>
      <span class="rec-count" id="recCount">0 records</span>
    </div>
    <p class="scroll-hint">← Swipe to scroll →</p>
    <div class="scroll-btns">
      <button class="scroll-btn" onclick="scrollTable(-160)">◀ Left</button>
      <button class="scroll-btn" onclick="scrollTable(160)">Right ▶</button>
    </div>
    <div class="table-scroll-wrap" id="scrollWrap">
      <div class="table-scroll" id="tableScroll">
        <div id="tableWrap">
          <div class="empty"><div class="ico">📡</div><p>Auto-connecting…</p></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════ REPORT MODAL ═══════════════════ -->
<div class="modal-bg" id="reportModal">
  <div class="modal">
    <div class="modal-hdr">
      <h2>🖨 Generate Report</h2>
      <button class="modal-close" onclick="closeReport()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Filter by Name</label>
          <select id="rName">
            <option value="">All Students</option>
          </select>
        </div>
        <div class="form-group">
          <label>Filter by Grade</label>
          <select id="rGrade">
            <option value="">All Grades</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>From Date</label>
          <input type="date" id="rFrom"/>
        </div>
        <div class="form-group">
          <label>To Date</label>
          <input type="date" id="rTo"/>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select id="rStatus">
            <option value="">All</option>
            <option>Authorised</option>
            <option>Denied</option>
          </select>
        </div>
      </div>

      <!-- Preview summary inside modal -->
      <div id="rPreview" style="margin-top:8px;padding:12px;background:var(--s2);
        border:1px solid var(--border);border-radius:8px;font-size:.82rem;color:var(--muted);
        font-family:var(--mono)">Select filters above to preview</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeReport()">Cancel</button>
      <button class="btn btn-ghost" onclick="previewReport()">👁 Preview</button>
      <button class="btn btn-amber" onclick="printReport()">🖨 Print</button>
    </div>
  </div>
</div>

<!-- ═══════════════════ PRINT AREA ═══════════════════ -->
<div id="printArea"></div>

<div id="toast"></div>

<script>
let allData = [], autoOn = false, autoTimer = null;
const AUTO_SEC = 5;
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby5yXY9eyHYl1Zh9bkkbPATi-cTAgWc_da_Sz2EWkj8KOyvcxVyy_Iw0sBBluUprvVeeQ/exec';

window.onload = () => {
  document.getElementById('urlInput').value = SCRIPT_URL;
  // Set default date range: today
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('rTo').value = today;
  // Default from = 30 days ago
  const from = new Date(); from.setDate(from.getDate()-30);
  document.getElementById('rFrom').value = from.toISOString().slice(0,10);

  loadData();
  setTimeout(toggleAuto, 1500);
};

/* ── Data load ── */
async function loadData() {
  const btn = document.getElementById('loadBtn');
  const icon = document.getElementById('loadIcon');
  btn.disabled = true;
  icon.innerHTML = '<span class="spin"></span>';
  try {
    const res  = await fetch(SCRIPT_URL + '?action=read');
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    allData = json.data || [];
    updateStats(); fillGradeFilter(); render();
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    toast('Loaded ' + allData.length + ' records', 'ok');
  } catch(e) {
    toast('Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false; icon.textContent = '↻';
  }
}

function updateStats() {
  document.getElementById('sTotal').textContent = allData.length;
  document.getElementById('sAuth').textContent  = allData.filter(r=>r.status==='Authorised').length;
  document.getElementById('sDeny').textContent  = allData.filter(r=>r.status==='Denied').length;
  document.getElementById('sUniq').textContent  = new Set(allData.map(r=>r.uid)).size;
}

function fillGradeFilter() {
  const grades = [...new Set(allData.map(r=>r.grade).filter(Boolean))].sort();
  ['fGrade','rGrade'].forEach(id => {
    const sel = document.getElementById(id);
    const first = sel.options[0].outerHTML;
    sel.innerHTML = first;
    grades.forEach(g => { const o=document.createElement('option'); o.value=g; o.textContent=g; sel.appendChild(o); });
  });
  // Fill name filter
  const names = [...new Set(allData.map(r=>r.name).filter(n=>n&&n!=='Unknown'))].sort();
  const rn = document.getElementById('rName');
  rn.innerHTML = '<option value="">All Students</option>';
  names.forEach(n => { const o=document.createElement('option'); o.value=n; o.textContent=n; rn.appendChild(o); });
}

/* ── Main table render ── */
function render() {
  const q  = document.getElementById('searchBox').value.toLowerCase();
  const fs = document.getElementById('fStatus').value;
  const fg = document.getElementById('fGrade').value;
  let rows = allData.filter(r => {
    const ms  = !q  || [r.name,r.uid,r.grade].some(v=>(v||'').toLowerCase().includes(q));
    const mst = !fs || r.status===fs;
    const mg  = !fg || r.grade===fg;
    return ms && mst && mg;
  }).slice().reverse();

  document.getElementById('recCount').textContent = rows.length + ' records';
  if (!rows.length) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty"><div class="ico">🔍</div><p>No records match.</p></div>';
    return;
  }
  const trs = rows.map((r,i)=>`
    <tr style="animation-delay:${Math.min(i*.025,.4)}s">
      <td class="td-ts">${r.timestamp||'—'}</td>
      <td class="td-uid">${r.uid||'—'}</td>
      <td class="td-name">${r.name||'—'}</td>
      <td><span class="grade-pill">${r.grade||'—'}</span></td>
      <td><span class="badge ${r.status==='Authorised'?'badge-ok':'badge-deny'}">
        <span class="badge-dot"></span>${r.status||'—'}</span></td>
    </tr>`).join('');
  document.getElementById('tableWrap').innerHTML = `
    <table><thead><tr>
      <th>Timestamp</th><th>UID</th><th>Name</th><th>Grade</th><th>Status</th>
    </tr></thead><tbody>${trs}</tbody></table>`;
  requestAnimationFrame(() => {
    const w=document.getElementById('tableScroll'), o=document.getElementById('scrollWrap');
    if(w&&o) o.classList.toggle('can-scroll', w.scrollWidth>w.clientWidth);
  });
}

/* ══════════════════════════════════════
   REPORT FUNCTIONS
══════════════════════════════════════ */
function getReportRows() {
  const name   = document.getElementById('rName').value;
  const grade  = document.getElementById('rGrade').value;
  const status = document.getElementById('rStatus').value;
  const from   = document.getElementById('rFrom').value;
  const to     = document.getElementById('rTo').value;

  return allData.filter(r => {
    if (name   && r.name   !== name)   return false;
    if (grade  && r.grade  !== grade)  return false;
    if (status && r.status !== status) return false;
    if (from || to) {
      const d = (r.timestamp||'').slice(0,10);
      if (from && d < from) return false;
      if (to   && d > to)   return false;
    }
    return true;
  }).slice().reverse();
}

function openReport() {
  document.getElementById('reportModal').classList.add('open');
  previewReport();
}
function closeReport() {
  document.getElementById('reportModal').classList.remove('open');
}

function previewReport() {
  const rows = getReportRows();
  const auth = rows.filter(r=>r.status==='Authorised').length;
  const deny = rows.filter(r=>r.status==='Denied').length;
  document.getElementById('rPreview').innerHTML =
    `<strong style="color:var(--text)">${rows.length}</strong> records found &nbsp;|&nbsp;
     <span style="color:var(--green)">✔ ${auth} Authorised</span> &nbsp;|&nbsp;
     <span style="color:var(--red)">✘ ${deny} Denied</span>`;
}

function printReport() {
  const rows = getReportRows();
  if (!rows.length) { toast('No records for selected filters', 'err'); return; }

  const name   = document.getElementById('rName').value   || 'All Students';
  const grade  = document.getElementById('rGrade').value  || 'All Grades';
  const status = document.getElementById('rStatus').value || 'All';
  const from   = document.getElementById('rFrom').value   || '—';
  const to     = document.getElementById('rTo').value     || '—';
  const auth   = rows.filter(r=>r.status==='Authorised').length;
  const deny   = rows.filter(r=>r.status==='Denied').length;
  const uniq   = new Set(rows.map(r=>r.uid)).size;

  const trs = rows.map(r=>`
    <tr>
      <td>${r.timestamp||'—'}</td>
      <td>${r.uid||'—'}</td>
      <td><strong>${r.name||'—'}</strong></td>
      <td>${r.grade||'—'}</td>
      <td class="${r.status==='Authorised'?'p-ok':'p-deny'}">${r.status||'—'}</td>
    </tr>`).join('');

  document.getElementById('printArea').innerHTML = `
    <div class="print-header">
      <h1>RFID ATTENDANCE REPORT</h1>
      <p>Generated: ${new Date().toLocaleString()}</p>
    </div>
    <div class="print-meta">
      <span><strong>Name:</strong> ${name}</span>
      <span><strong>Grade:</strong> ${grade}</span>
      <span><strong>Status:</strong> ${status}</span>
      <span><strong>From:</strong> ${from}</span>
      <span><strong>To:</strong> ${to}</span>
    </div>
    <div class="print-summary">
      <div class="print-sum-card"><div class="ps-val">${rows.length}</div><div class="ps-lbl">Total</div></div>
      <div class="print-sum-card"><div class="ps-val">${auth}</div><div class="ps-lbl">Authorised</div></div>
      <div class="print-sum-card"><div class="ps-val">${deny}</div><div class="ps-lbl">Denied</div></div>
      <div class="print-sum-card"><div class="ps-val">${uniq}</div><div class="ps-lbl">Unique Cards</div></div>
    </div>
    <table>
      <thead><tr>
        <th>Timestamp</th><th>UID</th><th>Name</th><th>Grade</th><th>Status</th>
      </tr></thead>
      <tbody>${trs}</tbody>
    </table>`;

  closeReport();
  setTimeout(() => window.print(), 200);
}

/* ── CSV export ── */
function exportCSV() {
  if (!allData.length) { toast('No data', 'err'); return; }
  const hdr  = ['Timestamp','UID','Name','Grade','Status'];
  const rows = allData.map(r=>[r.timestamp,r.uid,r.name,r.grade,r.status]
    .map(v=>`"${(v||'').replace(/"/g,'""')}"`) .join(','));
  const blob = new Blob([[hdr.join(','),...rows].join('\n')],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'attendance_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast('CSV exported', 'ok');
}

/* ── Auto refresh ── */
function toggleAuto() {
  autoOn = !autoOn;
  const btn=document.getElementById('autoBtn'), live=document.getElementById('liveDot');
  if (autoOn) {
    btn.textContent='⏱ Auto: ON'; btn.style.borderColor='var(--green)'; btn.style.color='var(--green)';
    live.style.display='inline-flex'; startProgBar();
    autoTimer = setInterval(()=>{startProgBar();loadData();}, AUTO_SEC*1000);
  } else {
    btn.textContent='⏱ Auto: OFF'; btn.style.borderColor=''; btn.style.color='';
    live.style.display='none'; clearInterval(autoTimer); resetProgBar();
  }
}
function startProgBar() {
  const f=document.getElementById('progFill');
  f.style.transition='none'; f.style.width='100%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ f.style.transition=`width ${AUTO_SEC}s linear`; f.style.width='0%'; }));
}
function resetProgBar() {
  const f=document.getElementById('progFill'); f.style.transition='none'; f.style.width='100%';
}

/* ── Helpers ── */
function scrollTable(px) {
  const el=document.getElementById('tableScroll'); if(el) el.scrollBy({left:px,behavior:'smooth'});
}
function toast(msg,type='inf') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show '+type;
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',3000);
}

// Close modal on background click
document.getElementById('reportModal').addEventListener('click', e=>{
  if (e.target===document.getElementById('reportModal')) closeReport();
});
</script>
